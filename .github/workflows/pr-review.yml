name: PR Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.type == 'User' &&
      contains(fromJSON('["@review", "@deepseek-review", "@free-review", "@review-retry", "@review-free", "@review-retry-free"]'), github.event.comment.body)
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Review
        uses: actions/github-script@v7
        env:
          DEEPSEEK_PR_REVIEW_TOKEN: ${{ secrets.DEEPSEEK_PR_REVIEW_TOKEN }}
          DEEPSEEK_PR_REVIEW_MODEL: ${{ vars.DEEPSEEK_PR_REVIEW_MODEL }}
          DEEPSEEK_PR_REVIEW_EFFORT: ${{ vars.DEEPSEEK_PR_REVIEW_EFFORT }}
          FREELLMAPI_URL: ${{ vars.FREELLMAPI_URL }}
          FREELLMAPI_TOKEN: ${{ secrets.FREELLMAPI_TOKEN }}
          FREELLMAPI_MODEL: ${{ vars.FREELLMAPI_MODEL }}
        with:
          script: |
            const { run } = require('./.github/review/review.cjs');
            const result = await run({ github, context, core });
            if (result) {
              core.setOutput('number', result.number);
              core.setOutput('verdict', result.verdict);
            }
